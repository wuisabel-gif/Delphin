[package]
name = "delphin"
version = "0.3.0"
edition = "2021"
description = "A duplex companion for AI agent CLIs: keep talking while it thinks. Prompts queue, a pluggable arbiter decides interrupt-vs-wait, and the whole conversation is remembered locally."
license = "MIT"
repository = "https://github.com/wuisabel-gif/Delphin"
homepage = "https://github.com/wuisabel-gif/Delphin"
readme = "README.md"
keywords = ["cli", "ai", "agent", "pty", "duplex"]
categories = ["command-line-utilities", "development-tools"]
# Ship only what `cargo install` needs — not the logo, landing page, or plugin files.
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
]

[[bin]]
name = "delphin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
dirs = "5"
owo-colors = "4"
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
terminal_size = "0.4"
toml = "0.8"

[dev-dependencies]
# Used by the e2e integration test to read back the recorded SQLite memory.
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 2
